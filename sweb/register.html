<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./login.css">
    <title>Đăng ký - Truyện</title>
</head>
<body>
    <div class="Yuriginiz">
        <form action="./login.html" method="post" class="login-card">
            <h1>Đăng ký</h1>
            <div class="input-group">
                <input type="text" class="form-input" placeholder="Tên đăng nhập" required>
            </div>
            <div class="input-group">
                <input type="email" class="form-input" placeholder="Địa chỉ Email" required>
            </div>
            <div class="input-group">
                <input type="password" class="form-input" placeholder="Mật khẩu" required>
            </div>
            <div class="input-group">
                <input type="password" class="form-input" placeholder="Xác nhận mật khẩu" required>
            </div>
            <button type="submit" class="btn-submit">Đăng ký tài khoản</button>
            <div class="form-footer">
                <span>Đã có tài khoản? </span>
                 <a href="./login.html" class="switch-link">Đăng nhập ngay</a>
            </div>
        </form>
    </div>
</body>
</html>
<script>
        const form = document.getElementById('registerForm');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm_password');

        form.addEventListener('submit', function(e) {
            if (password.value !== confirmPassword.value) {
                e.preventDefault(); // Chặn gửi form
                alert('Mật khẩu xác nhận không trùng khớp!!');
                confirmPassword.focus();
            }
        });
    </script>
</body>
</html>
